# on every push that touches skins/: rebuild index.json and commit it, so adding a skin is "add a folder, push"
name: build index
on:
  push:
    branches: [main]
    paths: ["skins/**", "tools/build-index.js"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-index.js
      - name: commit index.json
        run: |
          if git diff --quiet -- index.json; then echo "index.json already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "rebuild index.json"
          git push
